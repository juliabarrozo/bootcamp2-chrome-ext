name: CI/CD - Focus Timer Extension

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🔨 Build web
        run: npm run build:web

      - name: 🔨 Build API
        run: npm run build:api

      - name: 🎭 Instalar Playwright Chromium
        run: npx playwright install --with-deps chromium
      
      - name: 🚀 Start API
        run: |
          cd apps/api
          npm run dev &
          sleep 10
          
      - name: 🧪 Executar testes E2E
        run: npm run test:e2e

      - name: 📊 Upload relatório Playwright (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: 📦 Upload extensão empacotada
        uses: actions/upload-artifact@v4
        with:
          name: focus-timer-extension
          path: dist/extension.zip
          retention-days: 90

      - name: 📊 Upload relatório Playwright (sucesso)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-success
          path: playwright-report/
          retention-days: 7

      - name: ✅ Resumo dos testes
        if: always()
        run: |
          echo "## 🎯 Resultados dos Testes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build concluído com sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "📦 Extensão empacotada em: \`dist/extension.zip\`" >> $GITHUB_STEP_SUMMARY
